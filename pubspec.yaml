name: motoverse
description: "MotoVerse — the complete digital ecosystem and intelligent companion for motorcycle riders in Iran."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Backend / Supabase
  supabase_flutter: ^2.5.6

  # Routing
  go_router: ^14.2.0

  # Models / immutability
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  shared_preferences: ^2.2.3

  # UX
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Maps & notifications (modular surfaces — wired in core, used by features)
  google_maps_flutter: ^2.6.1
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  # Vazirmatn (Persian-first) is the brand typeface. The TTF binaries are not
  # committed; add them under assets/fonts/ and uncomment the block below, or
  # rely on the google_fonts package (already a dependency) at runtime.
  # fonts:
  #   - family: Vazirmatn
  #     fonts:
  #       - asset: assets/fonts/Vazirmatn-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Vazirmatn-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Vazirmatn-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Vazirmatn-Bold.ttf
  #         weight: 700
