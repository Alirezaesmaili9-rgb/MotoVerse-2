<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080E28">
<title>موتوتایپ | بازرگانی اسماعیلی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   بازرگانی اسماعیلی — راهنمای انتخاب موتورسیکلت
   پالت برند: آبی #3853EA · سرمه‌ای #121B60 · مشکی #080E28
   =================================================================== */
:root{
  --blue:#3853EA;
  --blue-glow:#5E78FF;
  --navy:#121B60;
  --night:#080E28;
  --ink:#F2F7FA;
  --soft:#E8EDF3;
  --muted:#93A0CE;
  --line:rgba(94,120,255,.18);
  --skew:-8deg;
  --rad:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--night);color-scheme:dark only}
body{
  font-family:'Vazirmatn',system-ui,sans-serif;
  background:var(--night) !important;
  color:var(--soft);
  min-height:100vh;
  overflow-x:hidden;
  font-feature-settings:"ss01";
}
/* خطوط سرعت پس‌زمینه — موتیف مورب لوگو */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    repeating-linear-gradient(98deg, transparent 0 140px, rgba(56,83,234,.05) 140px 142px),
    radial-gradient(900px 500px at 85% -10%, rgba(56,83,234,.22), transparent 60%),
    radial-gradient(700px 600px at 0% 110%, rgba(18,27,96,.8), transparent 65%);
}
.wrap{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:0 20px}

/* ---------- هدر ---------- */
header{display:flex;align-items:center;justify-content:space-between;padding:22px 0 10px}
.logo{height:44px;filter:brightness(1.18) drop-shadow(0 0 18px rgba(56,83,234,.45))}
.h-tag{font-size:.78rem;color:var(--muted);letter-spacing:.4px;border:1px solid var(--line);
  padding:6px 14px;transform:skewX(var(--skew));background:rgba(18,27,96,.5)}
.h-tag span{display:inline-block;transform:skewX(calc(var(--skew) * -1))}
.h-tag .bn{font-family:'Lalezar',cursive;font-weight:400;font-size:1.1rem;color:var(--blue-glow);letter-spacing:0}
.h-tag .bd{font-style:normal}

/* ---------- تیتر نمایشی ---------- */
.display{font-family:'Lalezar',cursive;font-weight:400;line-height:1.15;letter-spacing:.5px}

/* ---------- صفحه شروع ---------- */
.intro{padding:46px 0 70px;display:grid;gap:26px;justify-items:start}
.intro .kicker{color:var(--blue-glow);font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:10px}
.intro .kicker::before{content:"";width:34px;height:3px;background:var(--blue);transform:skewX(var(--skew))}
.intro h1{font-size:clamp(2.4rem,7vw,4.6rem);color:var(--ink)}
.intro h1 em{font-style:normal;color:var(--blue-glow);position:relative;white-space:nowrap}
.intro h1 em::after{content:"";position:absolute;right:0;left:0;bottom:6px;height:.32em;
  background:var(--blue);opacity:.28;transform:skewX(var(--skew));z-index:-1}
.intro p{max-width:560px;color:var(--muted);font-size:1.06rem;line-height:2}
.meta-row{display:flex;gap:14px;flex-wrap:wrap}
.meta-chip{transform:skewX(var(--skew));border:1px solid var(--line);background:rgba(18,27,96,.55);
  padding:9px 18px;font-size:.85rem;color:var(--soft)}
.meta-chip b{color:var(--blue-glow)}
.meta-chip span{display:inline-block;transform:skewX(calc(var(--skew) * -1))}

/* دکمه اصلی — متوازی‌الاضلاع برند */
.btn{
  font-family:'Lalezar',cursive;font-size:1.35rem;color:#fff;cursor:pointer;border:0;
  background:linear-gradient(135deg,var(--blue),#2438b8);
  padding:16px 46px;transform:skewX(var(--skew));
  box-shadow:0 10px 34px rgba(56,83,234,.42), inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
}
.btn span{display:inline-block;transform:skewX(calc(var(--skew) * -1))}
.btn:hover{filter:brightness(1.12);transform:skewX(var(--skew)) translateY(-2px);
  box-shadow:0 16px 44px rgba(56,83,234,.55), inset 0 1px 0 rgba(255,255,255,.25)}
.btn:active{transform:skewX(var(--skew)) translateY(1px)}
.btn:focus-visible{outline:3px solid var(--blue-glow);outline-offset:4px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);box-shadow:none;color:var(--soft);font-size:1.05rem;padding:12px 30px}
.btn.ghost:hover{border-color:var(--blue-glow);color:#fff}

/* ---------- نوار پیشرفت دنده‌ای ---------- */
.gear-bar{display:flex;gap:7px;margin:30px 0 8px}
.gear{flex:1;height:11px;background:rgba(94,120,255,.13);transform:skewX(var(--skew));
  border:1px solid rgba(94,120,255,.12);transition:background .35s,box-shadow .35s}
.gear.on{background:linear-gradient(90deg,var(--blue),var(--blue-glow));
  box-shadow:0 0 14px rgba(56,83,234,.65);border-color:transparent}
.gear-label{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;margin-bottom:26px}
.gear-label b{color:var(--blue-glow);font-weight:700}

/* ---------- کارت سؤال ---------- */
.quiz{max-width:680px;margin:0 auto;padding:10px 0 90px}
.q-card{animation:slideIn .4s cubic-bezier(.2,.8,.25,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.q-num{font-family:'Lalezar',cursive;color:var(--blue);font-size:1rem;letter-spacing:1px}
.q-title{font-size:clamp(1.5rem,4.5vw,2.2rem);color:var(--ink);margin:6px 0 6px;font-weight:900}
.q-hint{color:var(--muted);font-size:.95rem;margin-bottom:26px;line-height:1.9}

.opts{display:grid;gap:13px}
.opt{
  text-align:right;cursor:pointer;border:1.5px solid var(--line);
  background:linear-gradient(180deg,rgba(18,27,96,.72),rgba(18,27,96,.45));
  color:var(--soft);padding:17px 20px 15px;border-radius:14px;
  display:flex;align-items:center;gap:16px;position:relative;overflow:hidden;
  transition:border-color .16s, transform .16s, box-shadow .16s;
  font-family:inherit;font-size:1rem;
}
.opt::before{content:"";position:absolute;inset-block:0;right:0;width:5px;
  background:var(--blue);transform:skewX(var(--skew)) scaleY(0);transition:transform .18s}
.opt:hover{border-color:rgba(94,120,255,.55);transform:translateY(-2px);
  box-shadow:0 10px 26px rgba(8,14,40,.55)}
.opt:hover::before{transform:skewX(var(--skew)) scaleY(1)}
.opt:focus-visible{outline:3px solid var(--blue-glow);outline-offset:2px}
.opt .ico{font-size:1.6rem;flex:0 0 auto;width:52px;height:52px;display:grid;place-items:center;
  background:rgba(56,83,234,.14);transform:skewX(var(--skew));border:1px solid var(--line)}
.opt .ico span{transform:skewX(calc(var(--skew) * -1))}
.opt .t{font-weight:700;font-size:1.08rem;color:var(--ink)}
.opt .d{color:var(--muted);font-size:.85rem;margin-top:3px;line-height:1.7}
.opt.picked{border-color:var(--blue);background:linear-gradient(135deg,rgba(56,83,234,.34),rgba(18,27,96,.7));
  box-shadow:0 0 0 1px var(--blue), 0 12px 32px rgba(56,83,234,.3)}
.opt.picked::before{transform:skewX(var(--skew)) scaleY(1)}
.back{background:none;border:0;color:var(--muted);cursor:pointer;font-family:inherit;
  font-size:.9rem;margin-top:26px;padding:8px 4px;display:inline-flex;align-items:center;gap:7px}
.back:hover{color:var(--blue-glow)}
.back:focus-visible{outline:2px solid var(--blue-glow);outline-offset:3px}

/* ---------- نتایج ---------- */
.results{padding:14px 0 80px;animation:slideIn .45s cubic-bezier(.2,.8,.25,1)}
.r-head{text-align:center;margin-bottom:38px}
.r-head .kicker{color:var(--blue-glow);font-weight:700;font-size:.92rem}
.r-head h2{font-size:clamp(2rem,6vw,3.4rem);color:var(--ink)}
.r-head p{color:var(--muted);margin-top:8px;font-size:.98rem}

/* کارت قهرمان — پیشنهاد اول */
.champ{
  position:relative;border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;
  background:linear-gradient(160deg,rgba(18,27,96,.85),rgba(8,14,40,.9));
  display:grid;grid-template-columns:1.05fr 1fr;min-height:380px;margin-bottom:26px;
  box-shadow:0 30px 80px rgba(8,14,40,.7);
}
.champ .img{position:relative;min-height:260px;background:#0c1340}
.champ .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  clip-path:polygon(0 0, 100% 0, 92% 100%, 0 100%)}
.champ .img::after{content:"";position:absolute;inset:0;
  background:linear-gradient(200deg,transparent 40%,rgba(8,14,40,.55));
  clip-path:polygon(0 0, 100% 0, 92% 100%, 0 100%)}
.rank-flag{
  position:absolute;top:18px;right:18px;z-index:2;font-family:'Lalezar',cursive;
  background:linear-gradient(135deg,var(--blue),#2438b8);color:#fff;
  padding:8px 22px;transform:skewX(var(--skew));font-size:1.05rem;
  box-shadow:0 8px 22px rgba(56,83,234,.5)}
.rank-flag span{display:inline-block;transform:skewX(calc(var(--skew) * -1))}
.champ .body{padding:30px 30px 26px;display:flex;flex-direction:column;gap:16px}
.champ .name-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.champ h3{font-size:clamp(1.5rem,3.4vw,2.1rem);color:var(--ink);line-height:1.3}
.champ .en{color:var(--muted);font-size:.85rem;letter-spacing:1.5px;text-transform:uppercase;margin-top:3px}

/* حلقه درصد تطابق */
.ring{--p:0;flex:0 0 auto;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--blue-glow) calc(var(--p)*1%), rgba(94,120,255,.13) 0)}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:#0d1545}
.ring b{position:relative;font-family:'Lalezar',cursive;font-size:1.5rem;color:#fff}
.ring small{position:absolute;bottom:16px;font-size:.6rem;color:var(--muted)}

.badges{display:flex;gap:9px;flex-wrap:wrap}
.badge{font-size:.8rem;color:var(--soft);border:1px solid var(--line);padding:6px 14px;
  transform:skewX(var(--skew));background:rgba(56,83,234,.12)}
.badge span{display:inline-block;transform:skewX(calc(var(--skew) * -1))}
.badge.hot{background:rgba(56,83,234,.32);border-color:rgba(94,120,255,.5);color:#fff}

.why{font-size:.85rem;color:var(--blue-glow);font-weight:700;margin-bottom:-6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:.82rem;background:rgba(94,120,255,.13);border:1px solid var(--line);
  border-radius:30px;padding:6px 14px;color:var(--soft)}
.chip::before{content:"✓ ";color:var(--blue-glow);font-weight:900}
.pros{list-style:none;display:grid;gap:7px;color:var(--muted);font-size:.92rem;line-height:1.8}
.pros li{padding-right:20px;position:relative}
.pros li::before{content:"";position:absolute;right:0;top:.62em;width:10px;height:3px;
  background:var(--blue);transform:skewX(var(--skew))}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:10px}
.cta{font-family:'Lalezar',cursive;font-size:1.05rem;text-decoration:none;color:#fff;
  background:linear-gradient(135deg,var(--blue),#2438b8);padding:12px 30px;
  transform:skewX(var(--skew));box-shadow:0 8px 24px rgba(56,83,234,.4);transition:filter .15s,transform .15s}
.cta span{display:inline-block;transform:skewX(calc(var(--skew) * -1))}
.cta:hover{filter:brightness(1.12);transform:skewX(var(--skew)) translateY(-2px)}
.cta.line{background:transparent;border:1.5px solid var(--line);box-shadow:none;color:var(--soft)}
.cta.line:hover{border-color:var(--blue-glow);color:#fff}
.cta:focus-visible{outline:3px solid var(--blue-glow);outline-offset:3px}

/* کارت‌های دوم و سوم */
.runners{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.r-card{border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;position:relative;
  background:linear-gradient(170deg,rgba(18,27,96,.75),rgba(8,14,40,.85));
  display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.r-card:hover{transform:translateY(-4px);box-shadow:0 22px 50px rgba(8,14,40,.65)}
.r-card .img{position:relative;aspect-ratio:16/9;background:#0c1340}
.r-card .img img{width:100%;height:100%;object-fit:cover}
.r-card .img::after{content:"";position:absolute;inset:0;
  background:linear-gradient(200deg,transparent 55%,rgba(8,14,40,.6))}
.r-card .rank-flag{font-size:.92rem;padding:6px 17px}
.r-card .body{padding:20px 20px 22px;display:flex;flex-direction:column;gap:12px;flex:1}
.r-card h3{font-size:1.2rem;color:var(--ink)}
.r-card .mini-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.r-card .ring{width:64px;height:64px}
.r-card .ring::before{inset:5px}
.r-card .ring b{font-size:1.1rem}
.r-card .ring small{bottom:10px;font-size:.55rem}
.r-card .cta{font-size:.95rem;padding:10px 22px;align-self:flex-start;margin-top:auto}

.note{margin-top:30px;color:var(--muted);font-size:.85rem;text-align:center;line-height:1.9}
.again-row{display:flex;justify-content:center;margin-top:24px}

/* ---------- فوتر ---------- */
footer{border-top:1px solid rgba(94,120,255,.12);margin-top:30px;padding:26px 0 36px;
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
footer .logo{height:30px;opacity:.85}
footer p{color:var(--muted);font-size:.78rem;line-height:1.9}

/* ---------- ریسپانسیو ---------- */
@media (max-width:840px){
  .champ{grid-template-columns:1fr}
  .champ .img{aspect-ratio:16/9;min-height:0}
  .champ .img img,.champ .img::after{clip-path:polygon(0 0,100% 0,100% 88%,0 100%)}
  .runners{grid-template-columns:1fr}
}
@media (max-width:520px){
  .logo{height:36px}
  .h-tag .bd{display:none}
  .h-tag{padding:4px 12px}
  .intro{padding:30px 0 50px}
  .champ .body{padding:22px 18px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

/* برچسب «چرا این پیشنهاد؟» */
function reasonsFor(bike, ans){
  const r=[];
  const u=ans[0];
  if(u===0 && bike.s.city>=8) r.push('عالی برای ترافیک شهر');
  if(u===1 && bike.s.touring>=8) r.push('ساخته‌شده برای جاده');
  if(u===2 && bike.s.offroad>=8) r.push('آماده مسیر خاکی');
  if(u===3 && bike.s.city>=7 && bike.s.touring>=5) r.push('همه‌فن‌حریف شهر و جاده');
  if(ans[1]===0 && bike.s.beginner>=8) r.push('دوستِ تازه‌کارها');
  const tr=QUESTIONS[2].opts[ans[2]].trans;
  if(tr==='auto' && bike.trans==='auto') r.push('اتوماتیک، بدون دنده');
  if(tr==='manual' && bike.trans==='manual') r.push('دنده‌ای با کنترل کامل');
  if(ans[3]===1 && bike.s.twoUp>=7) r.push('راحت برای ترک‌نشین');
  const b=QUESTIONS[4].opts[ans[4]].budget;
  if(b===1 && bike.tier===1) r.push('اقتصادی و به‌صرفه');
  if(b===3 && bike.tier===3) r.push('فول‌آپشن رده‌بالا');
  const pr=ans[5];
  if(pr===0 && bike.s.econ>=8) r.push('مصرف سوخت کم');
  if(pr===1 && bike.s.comfort>=8) r.push('راحتی بالا');
  if(pr===2 && bike.s.fun>=8) r.push('شتاب و هیجان');
  if(pr===3 && bike.s.style>=8) r.push('خوش‌استایل');
  return r.slice(0,4);
}

/* موتور امتیازدهی */
function rank(ans){
  let maxPossible=0;
  // حداکثر ممکن برای نرمال‌سازی درصد
  QUESTIONS.forEach((q,i)=>{
    const o=q.opts[ans[i]];
    if(o.w) maxPossible += Object.values(o.w).reduce((a,v)=>a+v*10,0);
    if(o.trans && o.trans!=='any') maxPossible += 6;
    if(o.budget) maxPossible += 10;
  });
  const scored = BIKES.map(b=>{
    let s=0;
    QUESTIONS.forEach((q,i)=>{
      const o=q.opts[ans[i]];
      if(o.w) for(const k in o.w) s += (b.s[k]||0)*o.w[k];
      if(o.trans && o.trans!=='any'){
        s += (b.trans===o.trans) ? 6 : -24;
      }
      if(o.budget){
        const B=o.budget, t=b.tier;
        if(B===1) s += t===1?10 : t===2?-4 : -18;
        if(B===2) s += t===2?8  : t===1? 2 : -8;
        if(B===3) s += t===3?6  : t===2? 3 : 0;
      }
    });
    return {bike:b, score:s};
  }).sort((a,b)=>b.score-a.score).slice(0,3);

  return scored.map(x=>({
    ...x,
    pct: Math.max(42, Math.min(97, Math.round((x.score/maxPossible)*100)))
  }));
}

function pick(i,k,el){
  answers[i]=k;
  [...el.parentElement.children].forEach(c=>c.classList.remove('picked'));
  el.classList.add('picked');
  setTimeout(()=> i+1<QUESTIONS.length ? showQ(i+1) : showResults(), 320);
}
